<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6fb">
    <title>DevOps Fundamentals Quiz</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #182337;
        background: #f3f6fb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background: radial-gradient(ellipse at 15% 0%, #dce8ff 0, transparent 34rem), #f3f6fb;
      }
      main { width: min(100%, 760px); margin: 0 auto; }
      .hero { margin: 0 0 24px; }
      .eyebrow {
        margin: 0 0 8px;
        color: #5267d8;
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.04em; }
      .description { margin: 10px 0 0; color: #627087; line-height: 1.6; }
      .quiz-card {
        padding: clamp(20px, 5vw, 36px);
        border: 1px solid #e0e6f0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 55px rgb(28 45 78 / 9%);
      }
      .progress-row { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 10px; color: #65728a; font-size: 0.9rem; }
      progress { display: block; width: 100%; height: 8px; margin: 0 0 24px; accent-color: #5267d8; }
      fieldset { min-width: 0; margin: 0 0 22px; padding: 0; border: 0; }
      legend { width: 100%; margin: 0 0 12px; font-size: 1.08rem; font-weight: 700; line-height: 1.5; }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        margin-top: 9px;
        padding: 13px 14px;
        border: 1px solid #e0e6f0;
        border-radius: 11px;
        color: #34415a;
        cursor: pointer;
        line-height: 1.45;
        transition: border-color 120ms ease, background 120ms ease;
      }
      .option:hover { border-color: #9ba9ed; background: #f8f9ff; }
      .option:has(input:checked) { border-color: #5267d8; background: #f2f4ff; }
      .option input { margin: 3px 0 0; accent-color: #5267d8; }
      .option.correct { border-color: #70b891; background: #effaf3; }
      .option.incorrect { border-color: #e39797; background: #fff3f2; }
      .option input:disabled { cursor: default; }
      .explanation { margin: 10px 2px 0; color: #536179; font-size: 0.92rem; line-height: 1.5; }
      .actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
      button {
        min-height: 44px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #5267d8;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button:hover { background: #4053bd; }
      button:disabled { cursor: wait; opacity: 0.65; }
      #message { min-height: 1.5em; margin: 12px 0 0; color: #a22a3a; }
      #result { margin: 0 0 24px; }
      .score { margin: 0 0 5px; color: #293e9c; font-size: 1.5rem; font-weight: 750; }
      .score-copy { margin: 0; color: #627087; }
      @media (max-width: 520px) {
        body { padding: 28px 14px; }
        .actions { align-items: stretch; flex-direction: column; }
        .actions button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">Online quiz</p>
        <h1 id="quiz-title">Loading quiz…</h1>
        <p id="quiz-description" class="description"></p>
      </header>
      <section class="quiz-card" aria-label="Quiz">
        <div id="result" aria-live="polite" hidden></div>
        <div class="progress-row">
          <span id="question-count">Loading questions…</span>
          <span id="answered-count"></span>
        </div>
        <progress id="progress" max="1" value="0" aria-label="Quiz progress"></progress>
        <form id="quiz-form">
          <div id="questions"></div>
          <p id="message" role="status" aria-live="polite"></p>
          <div class="actions">
            <button id="submit-button" type="submit" disabled>Submit answers</button>
            <button id="retry-button" type="button" hidden>Try again</button>
          </div>
        </form>
      </section>
    </main>
    <script>
      const title = document.querySelector("#quiz-title");
      const description = document.querySelector("#quiz-description");
      const form = document.querySelector("#quiz-form");
      const questionsElement = document.querySelector("#questions");
      const questionCount = document.querySelector("#question-count");
      const answeredCount = document.querySelector("#answered-count");
      const progress = document.querySelector("#progress");
      const submitButton = document.querySelector("#submit-button");
      const retryButton = document.querySelector("#retry-button");
      const resultElement = document.querySelector("#result");
      const message = document.querySelector("#message");
      let quiz;
      let submitted = false;

      function updateProgress() {
        const answered = new Set(
          [...form.querySelectorAll('input[type="radio"]:checked')].map((input) => input.name)
        ).size;
        answeredCount.textContent = `${answered} of ${quiz.questions.length} answered`;
        progress.value = answered;
        submitButton.disabled = submitted;
      }

      function renderQuiz(data) {
        quiz = data;
        title.textContent = data.title;
        description.textContent = data.description;
        questionCount.textContent = `${data.questions.length} questions`;
        progress.max = data.questions.length;
        questionsElement.replaceChildren(...data.questions.map((question, index) => {
          const fieldset = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = `${index + 1}. ${question.text}`;
          fieldset.append(legend);
          for (const option of question.options) {
            const label = document.createElement("label");
            const input = document.createElement("input");
            const text = document.createElement("span");
            label.className = "option";
            input.type = "radio";
            input.name = question.id;
            input.value = option.id;
            input.addEventListener("change", updateProgress);
            text.textContent = option.text;
            label.append(input, text);
            fieldset.append(label);
          }
          return fieldset;
        }));
        updateProgress();
      }

      function showResults(result) {
        submitted = true;
        const score = document.createElement("p");
        const copy = document.createElement("p");
        score.className = "score";
        score.textContent = `You scored ${result.score} out of ${result.total} (${result.percentage}%)`;
        copy.className = "score-copy";
        copy.textContent = result.percentage === 100
          ? "Perfect score. Excellent work!"
          : "Review the explanations below, then try again.";
        resultElement.replaceChildren(score, copy);
        resultElement.hidden = false;

        for (const answer of result.results) {
          const fieldset = [...questionsElement.querySelectorAll("fieldset")]
            .find((item) => item.querySelector("input")?.name === answer.questionId);
          for (const input of fieldset.querySelectorAll("input")) {
            input.disabled = true;
            const label = input.closest("label");
            if (input.value === answer.correctOptionId) label.classList.add("correct");
            if (input.checked && !answer.isCorrect) label.classList.add("incorrect");
          }
          const explanation = document.createElement("p");
          explanation.className = "explanation";
          explanation.textContent = `Correct answer: ${answer.correctOptionText}. ${answer.explanation}`;
          fieldset.append(explanation);
        }
        submitButton.hidden = true;
        retryButton.hidden = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        submitButton.disabled = true;
        const answers = {};
        for (const input of form.querySelectorAll('input[type="radio"]:checked')) {
          answers[input.name] = input.value;
        }
        try {
          const response = await fetch("/api/quiz/submit", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ answers })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not submit the quiz.");
          showResults(result);
        } catch (error) {
          message.textContent = error.message;
          submitButton.disabled = false;
        }
      });

      retryButton.addEventListener("click", () => {
        submitted = false;
        resultElement.hidden = true;
        message.textContent = "";
        submitButton.hidden = false;
        retryButton.hidden = true;
        renderQuiz(quiz);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      fetch("/api/quiz")
        .then(async (response) => {
          if (!response.ok) throw new Error("Could not load the quiz. Please refresh the page.");
          return response.json();
        })
        .then(renderQuiz)
        .catch((error) => {
          questionCount.textContent = "";
          progress.hidden = true;
          message.textContent = error.message;
          submitButton.disabled = true;
        });
    </script>
  </body>
</html>
